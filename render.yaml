services:
  - type: web
    name: lottery-display
    runtime: node
    buildCommand: npm install --prefix client && npm run build --prefix client && npm install --prefix server
    startCommand: npm run start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_PASSPHRASE
        sync: false
